<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест ППО | Москва ЛАЙВ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at 20% 30%, #0a0a2a, #050510);
      min-height: 100vh;
      color: #fff;
    }
    .neon-glow { text-shadow: 0 0 5px #ff00d4, 0 0 10px #ff00d4, 0 0 20px #ff00d4; }
    .btn-neon {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #ff00d4;
      color: #ff00d4;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      font-size: 16px;
    }
    .btn-neon:hover {
      background: #ff00d4;
      color: #050510;
      box-shadow: 0 0 30px #ff00d4;
      transform: scale(1.02);
    }
    .btn-neon-green {
      border-color: #00ff88;
      color: #00ff88;
    }
    .btn-neon-green:hover {
      background: #00ff88;
      box-shadow: 0 0 30px #00ff88;
    }
    .btn-neon-blue {
      border-color: #00d4ff;
      color: #00d4ff;
    }
    .btn-neon-blue:hover {
      background: #00d4ff;
      box-shadow: 0 0 30px #00d4ff;
    }
    .btn-home {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-home:hover {
      background: #ff00d4;
      border-color: #ff00d4;
      color: #050510;
      transform: scale(1.02);
    }
    .glass-card {
      background: rgba(15, 25, 45, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid rgba(255, 0, 212, 0.3);
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .question-block {
      background: rgba(10, 15, 30, 0.7);
      border-radius: 24px;
      padding: 24px;
      border-left: 4px solid #ff00d4;
    }
    .timer-box {
      font-size: 36px;
      font-weight: 800;
      text-align: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 60px;
      margin-bottom: 24px;
      border: 1px solid #ff00d4;
      color: #ff00d4;
      letter-spacing: 2px;
    }
    .result {
      text-align: center;
      padding: 20px;
      border-radius: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
    .result-success {
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      border: 1px solid #00ff88;
    }
    .result-fail {
      background: rgba(255, 0, 212, 0.15);
      color: #ff00d4;
      border: 1px solid #ff00d4;
    }
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #ff00d4;
      color: white;
      margin-top: 12px;
      font-size: 14px;
      resize: vertical;
    }
    input[type="radio"] {
      accent-color: #ff00d4;
      width: 18px;
      height: 18px;
      margin-right: 12px;
    }
    .hidden { display: none; }
    .table-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #ff00d4;
      color: #ff00d4;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    .table-link:hover {
      background: #ff00d4;
      color: #050510;
      box-shadow: 0 0 15px #ff00d4;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
    }
    .nav-buttons button {
      flex: 1;
    }
    .question-counter {
      text-align: center;
      margin-bottom: 16px;
      font-size: 14px;
      color: #aaa;
      letter-spacing: 1px;
    }
    .written-hint {
      background: rgba(0, 212, 255, 0.1);
      border-left: 3px solid #00d4ff;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #00d4ff;
    }
    .radio-label {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .radio-label:hover {
      background: rgba(255, 0, 212, 0.1);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeInUp 0.4s ease-out;
    }
    .feedback-area {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      border-left: 4px solid #00d4ff;
    }
    .feedback-area textarea {
      margin-top: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<a href="index.html" class="btn-home">
  🏠 НА ГЛАВНУЮ
</a>

<div class="glass-card max-w-2xl mx-auto mt-12 p-6">
  <div class="text-center mb-6">
    <h1 class="text-5xl font-extrabold neon-glow mb-2">📋 ТЕСТ ППО</h1>
    <p class="text-gray-300 mt-1">Проверь свои знания правил публикации объявлений</p>
    <div class="mt-4">
      <a href="https://www.table-ppo.ru/" target="_blank" class="table-link">
        📖 Открыть официальную таблицу ППО
      </a>
    </div>
  </div>

  <div id="step1" class="animate-in">
    <input type="text" id="username" placeholder="Введите ваше имя и фамилию" class="w-full p-4 rounded-xl bg-black/40 border-2 border-pink-500 text-white text-center text-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
    <button class="btn-neon w-full mt-6" id="startBtn">▶ СТАРТ ТЕСТА</button>
  </div>

  <div id="step2" class="hidden animate-in">
    <div class="timer-box" id="timerDisplay">30:00</div>
    <div class="question-counter" id="questionCounter">Вопрос 1 из 0</div>
    <div id="currentQuestion"></div>
    <div class="nav-buttons">
      <button id="prevBtn" class="btn-neon btn-neon-blue" disabled>◀ НАЗАД</button>
      <button id="nextBtn" class="btn-neon btn-neon-blue">ДАЛЕЕ ▶</button>
    </div>
    <button class="btn-neon btn-neon-green w-full mt-6" id="checkBtn">✅ ЗАВЕРШИТЬ ТЕСТ</button>
    <div id="resultArea"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCuOIt7wMUrN8vu9RQqivNj9w3CdFitrqE",
  authDomain: "moscow-live-tests.firebaseapp.com",
  projectId: "moscow-live-tests",
  storageBucket: "moscow-live-tests.firebasestorage.app",
  messagingSenderId: "956332293918",
  appId: "1:956332293918:web:e7f66986cca2a30474130f"
};

// DISCORD WEBHOOKS
const DISCORD_RESULTS = "https://discord.com/api/webhooks/1500489572025372842/IGJtGda4K64g0comJ-PbOo04fiAVNTfFmD_sZSNk8W0fqbPsgsV0s7yhO-3kMQ-67urU";
const DISCORD_SUGGESTIONS = "https://discord.com/api/webhooks/1500489792159354900/temeK7DdbRTfd88JBRD_2vLM8QpDRpUMl4CBsyyfrVbw3fJ64znRfr52nZ4iZNEN-7Ks";

let db = null, allQuestions = [], selected = [], userAnswers = {}, timerInterval = null, timeLeft = 1800, testActive = false;
let currentQuestionIndex = 0;
let feedbackSent = false;
let showWrittenHint = true;

// Загрузка настроек подсказки из Firebase
async function loadHintSetting() {
  try {
    const snap = await firebase.database().ref('settings/global').once('value');
    const settings = snap.exists() ? snap.val() : {};
    showWrittenHint = settings.showWrittenHint !== false;
  } catch(e) { showWrittenHint = true; }
}

// ========== ПОДТВЕРЖДЕНИЕ ВЫХОДА ==========
window.addEventListener('beforeunload', function(e) {
  if (testActive) {
    e.preventDefault();
    e.returnValue = '⚠️ Вы не завершили тест! Точно хотите уйти?';
    return e.returnValue;
  }
});

firebase.initializeApp(firebaseConfig);
db = firebase.database();
loadHintSetting();

async function loadQuestions() {
  const mc = await db.ref('questions/ppoQuestions').once('value');
  const wr = await db.ref('questions/ppoWrittenQuestions').once('value');
  let mcQ = mc.exists() ? mc.val() : [];
  let wrQ = wr.exists() ? wr.val() : [];
  mcQ = mcQ.filter(q => q && q.inTest !== false);
  wrQ = wrQ.filter(q => q && q.inTest !== false);
  allQuestions = [...mcQ, ...wrQ];
  return allQuestions.length;
}

function shuffle(arr) { 
  for(let i = arr.length - 1; i > 0; i--) { 
    let j = Math.floor(Math.random() * (i + 1)); 
    [arr[i], arr[j]] = [arr[j], arr[i]]; 
  } 
  return arr; 
}

// ========== ОТПРАВКА В DISCORD ==========
async function sendToDiscord(webhook, title, description, color) {
  try {
    await fetch(webhook, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        embeds: [{
          title: title,
          description: description,
          color: color,
          footer: { text: "Москва Лайв | Система тестирования" }
        }]
      })
    });
  } catch(e) { console.error("Discord send error:", e); }
}

async function startTest() {
  const username = document.getElementById('username').value.trim();
  if(!username) { 
    alert('❌ Пожалуйста, введите ваше имя и фамилию!'); 
    return; 
  }
  
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = "⏳ ЗАГРУЗКА...";
  startBtn.disabled = true;
  
  const cnt = await loadQuestions();
  
  startBtn.textContent = "▶ СТАРТ ТЕСТА";
  startBtn.disabled = false;
  
  if(cnt === 0) { 
    alert('❌ Нет вопросов для теста!'); 
    return; 
  }
  
  selected = shuffle([...allQuestions]);
  userAnswers = {};
  testActive = true;
  timeLeft = 1800;
  currentQuestionIndex = 0;
  renderCurrentQuestion();
  startTimer();
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
}

function renderCurrentQuestion() {
  const container = document.getElementById('currentQuestion');
  const counter = document.getElementById('questionCounter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  
  if (!selected.length) {
    container.innerHTML = '<div class="error-message">❌ Ошибка: нет вопросов</div>';
    return;
  }
  
  counter.innerHTML = `📌 Вопрос ${currentQuestionIndex + 1} из ${selected.length}`;
  prevBtn.disabled = (currentQuestionIndex === 0);
  nextBtn.textContent = (currentQuestionIndex === selected.length - 1) ? '🏁 ПОСЛЕДНИЙ ▶' : '➡ ДАЛЕЕ';
  
  const q = selected[currentQuestionIndex];
  const savedAnswer = userAnswers[currentQuestionIndex] || '';
  const isWritten = !(q.options && q.options.length);
  
  let inner = `<div class="question-block" id="q-${currentQuestionIndex}">
    <div class="font-bold text-xl mb-4">${currentQuestionIndex + 1}. ${escapeHtml(q.q)}</div>`;
  
  if(isWritten && showWrittenHint) {
    inner += `<div class="written-hint">
      <span style="font-size: 16px; margin-right: 8px;">💡</span> 
      Если объявление написано с ошибками или некорректно, напишите: 
      <strong style="color: #fff; background: rgba(0,212,255,0.2); padding: 2px 8px; border-radius: 20px;">"Не корректное объявление."</strong>
    </div>`;
  }
  
  if(q.options && q.options.length) {
    inner += `<div class="space-y-2 mt-2">`;
    q.options.forEach(opt => {
      inner += `
        <label class="radio-label">
          <input type="radio" name="currentQ" value="${escapeHtml(opt)}" ${savedAnswer === opt ? 'checked' : ''}>
          <span class="flex-1">${escapeHtml(opt)}</span>
        </label>
      `;
    });
    inner += `</div>`;
  } else {
    inner += `<textarea name="currentQ" rows="3" placeholder="✏️ Введите отредактированный вариант объявления..." class="w-full p-3 rounded-xl bg-black/40 border border-pink-500 focus:ring-2 focus:ring-pink-500">${escapeHtml(savedAnswer)}</textarea>`;
  }
  
  inner += `<div class="answer-hint hidden mt-3 pt-2 border-t border-pink-500/30 text-sm" id="hint-${currentQuestionIndex}"></div></div>`;
  container.innerHTML = inner;
  
  const radios = document.querySelectorAll('input[name="currentQ"]');
  const textarea = document.querySelector('textarea[name="currentQ"]');
  
  if(radios.length) {
    radios.forEach(r => {
      r.addEventListener('change', () => {
        userAnswers[currentQuestionIndex] = r.value;
      });
    });
  } else if(textarea) {
    textarea.addEventListener('input', () => {
      userAnswers[currentQuestionIndex] = textarea.value;
    });
  }
}

function nextQuestion() {
  if(currentQuestionIndex < selected.length - 1) {
    currentQuestionIndex++;
    renderCurrentQuestion();
  }
}

function prevQuestion() {
  if(currentQuestionIndex > 0) {
    currentQuestionIndex--;
    renderCurrentQuestion();
  }
}

function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    if(!testActive) return;
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0) { 
      clearInterval(timerInterval); 
      alert('⏰ Время вышло!'); 
      finishTestAndShowResults(); 
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  document.getElementById('timerDisplay').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function finishTestAndShowResults() {
  if(!testActive) return;
  testActive = false;
  clearInterval(timerInterval);
  const username = document.getElementById('username').value.trim();
  
  let correctCount = 0;
  const userResults = [];
  
  for(let i = 0; i < selected.length; i++) {
    const q = selected[i];
    const userAnswer = userAnswers[i] || '';
    let isCorrect = false;
    
    if(q.options && q.options.length) {
      isCorrect = (userAnswer === q.answer);
    } else {
      const normalize = (str) => str.trim().toLowerCase().replace(/[«»"„“]/g, '"').replace(/\s+/g, ' ');
      isCorrect = normalize(userAnswer) === normalize(q.answer || '');
    }
    if(isCorrect) correctCount++;
    userResults.push({ q, userAnswer, isCorrect });
  }
  
  const container = document.getElementById('currentQuestion');
  let resultsHtml = `
    <div class="result ${correctCount >= Math.floor(selected.length * 0.7) ? 'result-success' : 'result-fail'} mb-6">
      <div class="text-2xl font-bold mb-2">📊 РЕЗУЛЬТАТ</div>
      <div class="text-4xl font-black">${correctCount} / ${selected.length}</div>
      <div class="mt-2 text-lg">${correctCount >= Math.floor(selected.length * 0.7) ? '✅ СДАЛ!' : '❌ НЕ СДАЛ'}</div>
    </div>
    <div class="space-y-4" id="resultsList"></div>
  `;
  
  resultsHtml += `
    <div class="feedback-area">
      <label class="font-bold mb-2 block">💬 Что было непонятно? Замечания, предложения:</label>
      <textarea id="feedbackComment" rows="3" placeholder="Например: вопросы про транспорт слишком сложные, или нашли ошибку в вопросе..."></textarea>
      <button id="submitFeedbackBtn" class="btn-neon btn-neon-blue w-full mt-2">📨 ОТПРАВИТЬ ОБРАТНУЮ СВЯЗЬ</button>
    </div>
  `;
  
  container.innerHTML = resultsHtml;
  
  const resultsList = document.getElementById('resultsList');
  for(let i = 0; i < userResults.length; i++) {
    const r = userResults[i];
    const resultDiv = document.createElement('div');
    resultDiv.className = `question-block ${r.isCorrect ? 'border-l-green-500' : 'border-l-red-500'}`;
    resultDiv.style.borderLeftColor = r.isCorrect ? '#00ff88' : '#ff00d4';
    resultDiv.innerHTML = `
      <div class="font-bold text-lg mb-2">${i+1}. ${escapeHtml(r.q.q)}</div>
      <div class="text-sm mb-1 text-gray-300">📝 Ваш ответ: ${escapeHtml(r.userAnswer) || '(не выбран)'}</div>
      <div class="text-sm ${r.isCorrect ? 'text-green-400' : 'text-red-400'}">
        ${r.isCorrect ? '✅ Верно!' : '❌ Ошибка!'} 
        <span class="text-gray-300">Правильный ответ:</span> ${escapeHtml(r.q.answer)}
      </div>
    `;
    resultsList.appendChild(resultDiv);
  }
  
  document.querySelector('.nav-buttons').style.display = 'none';
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('questionCounter').innerHTML = '🏆 РЕЗУЛЬТАТЫ ТЕСТА';
  
  const pass = Math.floor(selected.length * 0.7);
  const passed = correctCount >= pass;
  const percent = Math.round(correctCount / selected.length * 100);
  
  // Отправляем результат в канал результатов
  sendToDiscord(DISCORD_RESULTS, `📊 Результат теста ППО`, `**${username}** ${passed ? '✅ СДАЛ' : '❌ НЕ СДАЛ'}\n📊 ${correctCount}/${selected.length} (${percent}%)\n🎯 Проходной балл: ${Math.floor(selected.length * 0.7)} правильных`, passed ? 0x00ff88 : 0xff00d4);
  
  // Обработчик отправки комментария (в канал предложений)
  document.getElementById('submitFeedbackBtn').addEventListener('click', async () => {
    if (feedbackSent) {
      alert('Вы уже отправили обратную связь!');
      return;
    }
    const comment = document.getElementById('feedbackComment').value.trim();
    if (!comment) {
      alert('Введите текст комментария!');
      return;
    }
    await sendToDiscord(DISCORD_SUGGESTIONS, `💡 Предложение / замечание от ${username}`, comment, 0x00d4ff);
    feedbackSent = true;
    alert('✅ Спасибо за обратную связь! Отправлено в Discord.');
    document.getElementById('submitFeedbackBtn').disabled = true;
    document.getElementById('submitFeedbackBtn').textContent = '✅ ОТПРАВЛЕНО';
  });
}

function checkAnswers() {
  finishTestAndShowResults();
}

function escapeHtml(t) { 
  if(!t) return ''; 
  return t.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[m]); 
}

document.getElementById('startBtn').onclick = startTest;
document.getElementById('nextBtn').onclick = nextQuestion;
document.getElementById('prevBtn').onclick = prevQuestion;
document.getElementById('checkBtn').onclick = checkAnswers;
</script>
</body>
</html>
