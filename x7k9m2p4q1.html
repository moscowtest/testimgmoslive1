<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Admin | Москва ЛАЙВ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: radial-gradient(ellipse at 20% 30%, #0a0a2a, #050510); min-height: 100vh; color: #fff; }
    .neon-glow { text-shadow: 0 0 5px #00d4ff, 0 0 10px #00d4ff, 0 0 20px #00d4ff; }
    .btn-neon { background: rgba(0,0,0,0.6); border: 2px solid #00d4ff; color: #00d4ff; padding: 10px 20px; border-radius: 60px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); }
    .btn-neon:hover { background: #00d4ff; color: #050510; box-shadow: 0 0 20px #00d4ff; transform: scale(1.02); }
    .btn-neon-pink { border-color: #ff00d4; color: #ff00d4; }
    .btn-neon-pink:hover { background: #ff00d4; box-shadow: 0 0 20px #ff00d4; }
    .btn-neon-green { border-color: #00ff88; color: #00ff88; }
    .btn-neon-green:hover { background: #00ff88; box-shadow: 0 0 20px #00ff88; }
    .glass-card { background: rgba(20,20,50,0.4); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(0,212,255,0.3); padding: 20px; }
    input { background: rgba(0,0,0,0.5); border: 1px solid #00d4ff; border-radius: 12px; padding: 12px; color: #00d4ff; outline: none; font-size: 16px; text-align: center; }
    input:focus { box-shadow: 0 0 15px rgba(0,212,255,0.3); }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #00d4ff; color: #050510; padding: 12px 20px; border-radius: 12px; z-index: 1000; font-weight: bold; }
    .toast.error { background: #ff00d4; }
    .login-container { max-width: 400px; margin: 0 auto; text-align: center; }
    .error-text { color: #ff8888; font-size: 14px; margin-top: 8px; }
    .blocked-text { color: #ffaa00; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>

<div class="max-w-7xl mx-auto p-4 md:p-6">
  <div class="flex justify-between items-center mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-r from-cyan-400 to-pink-500 rounded-xl flex items-center justify-center"><i class="fas fa-crown text-white"></i></div>
      <div><h1 class="text-2xl font-bold neon-glow">NEON ADMIN</h1><p class="text-gray-400 text-sm">Безопасная панель управления</p></div>
    </div>
  </div>

  <div class="glass-card">
    <!-- ШАГ 1: Ввод пароля -->
    <div id="step1" class="login-container p-6">
      <h2 class="text-2xl font-bold mb-4 neon-glow">🔐 ВХОД В АДМИНКУ</h2>
      <input type="password" id="passwordInput" placeholder="Введите пароль" class="w-full mb-3">
      <button onclick="checkPassword()" class="btn-neon w-full">ПРОДОЛЖИТЬ</button>
      <div id="passwordError" class="error-text mt-2 hidden"></div>
      <div id="blockedMessage" class="blocked-text mt-2 hidden"></div>
    </div>

    <!-- ШАГ 2: Ввод 2FA кода -->
    <div id="step2" class="login-container p-6" style="display: none;">
      <h2 class="text-2xl font-bold mb-4 neon-glow">🔢 ДВУХФАКТОРНАЯ АУТЕНТИФИКАЦИЯ</h2>
      <p class="text-sm text-gray-300 mb-3">Код отправлен в приватный Discord-канал</p>
      <input type="text" id="codeInput" placeholder="Введите 6-значный код" class="w-full mb-3" maxlength="6">
      <button onclick="check2FACode()" class="btn-neon btn-neon-green w-full">ПОДТВЕРДИТЬ</button>
      <button onclick="resendCode()" class="btn-neon w-full mt-2" style="background: #334155;">🔄 Отправить код повторно</button>
      <div id="codeError" class="error-text mt-2 hidden"></div>
    </div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCuOIt7wMUrN8vu9RQqivNj9w3CdFitrqE",
  authDomain: "moscow-live-tests.firebaseapp.com",
  projectId: "moscow-live-tests",
  storageBucket: "moscow-live-tests.firebasestorage.app",
  messagingSenderId: "956332293918",
  appId: "1:956332293918:web:e7f66986cca2a30474130f"
};

// ========== ВЕБХУК ДЛЯ 2FA ==========
const DISCORD_CODE_WEBHOOK = "https://discord.com/api/webhooks/1503013566289281037/5hJsRG7FVQK0hG3j8NSCIqwg-qmf39fi8tzsbL_IaCJnWtjHJ9RMyL-yf8Z5OVdT1MXR";
// ===================================

let pending2FACode = null;
let codeExpiration = null;
let failedAttempts = 0;
let blockedUntil = null;
let db = null;

// ИНИЦИАЛИЗАЦИЯ FIREBASE СРАЗУ
if (!firebase.apps.length) {
  firebase.initializeApp(FIREBASE_CONFIG);
}
db = firebase.database();

function showToast(msg, isError = false) {
  const toast = document.createElement('div');
  toast.className = `toast ${isError ? 'error' : ''}`;
  toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i>${msg}`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

async function sendCodeToDiscord(code) {
  try {
    await fetch(DISCORD_CODE_WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: `🔐 **Код для входа в админ-панель Москва Лайв**\n\`\`\`${code}\`\`\`\nКод действителен 5 минут. Никому не сообщайте!`,
        username: "2FA Bot"
      })
    });
    return true;
  } catch(e) {
    console.error(e);
    return false;
  }
}

async function loadBlockStatus() {
  try {
    const snapshot = await db.ref('settings/adminBlock').once('value');
    const data = snapshot.val();
    if (data && data.blockedUntil && data.blockedUntil > Date.now()) {
      blockedUntil = data.blockedUntil;
      const minutesLeft = Math.ceil((blockedUntil - Date.now()) / 60000);
      document.getElementById('blockedMessage').innerText = `🔒 Слишком много попыток. Доступ заблокирован на ${minutesLeft} минут.`;
      document.getElementById('blockedMessage').classList.remove('hidden');
      document.getElementById('passwordInput').disabled = true;
      document.querySelector('#step1 button').disabled = true;
    } else if (data && data.blockedUntil && data.blockedUntil <= Date.now()) {
      await db.ref('settings/adminBlock').remove();
      failedAttempts = 0;
      blockedUntil = null;
    }
  } catch(e) { console.error(e); }
}

async function saveBlock(attempts) {
  if (attempts >= 3) {
    const blockTime = Date.now() + 15 * 60 * 1000;
    await db.ref('settings/adminBlock').set({
      failedAttempts: attempts,
      blockedUntil: blockTime
    });
    blockedUntil = blockTime;
    document.getElementById('blockedMessage').innerText = `🔒 Слишком много попыток. Доступ заблокирован на 15 минут.`;
    document.getElementById('blockedMessage').classList.remove('hidden');
    document.getElementById('passwordInput').disabled = true;
    document.querySelector('#step1 button').disabled = true;
  }
}

async function checkPassword() {
  const password = document.getElementById('passwordInput').value;
  if (!password) {
    showToast('Введите пароль!', true);
    return;
  }
  
  if (blockedUntil && blockedUntil > Date.now()) {
    showToast('Доступ временно заблокирован!', true);
    return;
  }
  
  try {
    const snapshot = await db.ref('settings/adminPassword').once('value');
    const correctPassword = snapshot.val();
    
    if (correctPassword && password === correctPassword) {
      failedAttempts = 0;
      await db.ref('settings/adminBlock').remove();
      
      pending2FACode = Math.floor(100000 + Math.random() * 900000).toString();
      codeExpiration = Date.now() + 5 * 60 * 1000;
      
      await sendCodeToDiscord(pending2FACode);
      showToast('✅ Код подтверждения отправлен в Discord!');
      
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    } else {
      failedAttempts++;
      await saveBlock(failedAttempts);
      showToast('Неверный пароль!', true);
      document.getElementById('passwordError').innerText = `Неверный пароль! Осталось попыток: ${3 - failedAttempts}`;
      document.getElementById('passwordError').classList.remove('hidden');
    }
  } catch(e) {
    console.error(e);
    showToast('Ошибка проверки пароля: ' + e.message, true);
  }
}

async function check2FACode() {
  const code = document.getElementById('codeInput').value;
  if (!code) {
    showToast('Введите код подтверждения!', true);
    return;
  }
  
  if (!pending2FACode || Date.now() > codeExpiration) {
    showToast('Код истёк. Запросите новый.', true);
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    pending2FACode = null;
    return;
  }
  
  if (code === pending2FACode) {
    pending2FACode = null;
    showToast('✅ Доступ разрешён! Загрузка панели...');
    loadAdminPanel();
  } else {
    showToast('Неверный код подтверждения!', true);
    document.getElementById('codeError').innerText = 'Неверный код!';
    document.getElementById('codeError').classList.remove('hidden');
  }
}

async function resendCode() {
  if (pending2FACode && Date.now() < codeExpiration) {
    await sendCodeToDiscord(pending2FACode);
    showToast('✅ Код отправлен повторно!');
  } else {
    showToast('Код истёк. Начните вход заново.', true);
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step1').style.display = 'block';
    pending2FACode = null;
  }
}

function loadAdminPanel() {
  const mainElement = document.querySelector('.glass-card');
  mainElement.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl p-3"><p class="text-xs opacity-80">Всего</p><p class="text-2xl font-bold" id="statTotal">0</p></div>
      <div class="bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl p-3"><p class="text-xs opacity-80">Выбор</p><p class="text-2xl font-bold" id="statMultiple">0</p></div>
      <div class="bg-gradient-to-br from-green-500 to-emerald-500 rounded-xl p-3"><p class="text-xs opacity-80">Письменные</p><p class="text-2xl font-bold" id="statWritten">0</p></div>
      <div class="bg-gradient-to-br from-orange-500 to-red-500 rounded-xl p-3"><p class="text-xs opacity-80">В тесте</p><p class="text-2xl font-bold" id="statSelected">0</p></div>
    </div>
    <div id="adminMainContent">Загрузка панели управления...</div>
  `;
  
  // Твоя основная логика админки
  setTimeout(() => {
    document.getElementById('adminMainContent').innerHTML = `
      <div class="bg-gradient-to-r from-cyan-500/20 to-purple-500/20 rounded-xl p-4 mb-6">
        <div class="flex flex-wrap justify-between gap-3">
          <div><i class="fas fa-check-double mr-2"></i><span class="font-semibold">Отбор вопросов для теста</span></div>
          <div class="flex flex-wrap gap-2">
            <button class="btn-neon text-sm py-1">Выбрать все</button>
            <button class="btn-neon text-sm py-1">Снять все</button>
            <div class="flex gap-1"><input type="number" value="20" min="1" class="w-16 text-center"><button class="btn-neon text-sm py-1">Рандом</button></div>
          </div>
        </div>
      </div>
      <div class="bg-white/5 rounded-xl p-4 mb-6">
        <h2>Админ-панель загружена</h2>
        <p class="text-gray-400 mt-2">Функционал будет доступен после полной настройки</p>
      </div>
    `;
  }, 500);
}

// Загружаем статус блокировки при старте
loadBlockStatus();
</script>
</body>
</html>
